---
name: Release
on:
  push:
    tags: [v*]
permissions: {}
jobs:
  release:
    uses: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml@5b8d75c27ab40fe6ef0e18b35912125c0ed6b2d1 # v10.1.1
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    with:
      go-version-file: go.mod
      aqua_policy_allow: true
      aqua_version: v2.64.0
      split_build: true
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
