---
name: Release
on:
  push:
    tags: [v*]
permissions: {}
jobs:
  release:
    uses: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml@e51f0489838572acbab6eb550c56a4aac220dd48 # v10.0.1
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    with:
      go-version-file: go.mod
      aqua_policy_allow: true
      aqua_version: v2.64.0
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
