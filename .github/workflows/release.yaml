---
name: Release
on:
  push:
    tags: [v*]
permissions: {}
jobs:
  release:
    uses: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml@a5826a4c2f839241dd5771d1db5a79e765e47243 # v10.2.1-0
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    with:
      go-version-file: go.mod
      aqua_policy_allow: true
      aqua_version: v2.65.2
      split_build: true
      slsa_provenance: true
      packslip: true
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
