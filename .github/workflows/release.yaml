---
name: Release
on:
  push:
    tags: [v*]
permissions: {}
jobs:
  release:
    uses: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml@f3116b4a0418dc22a5332182659bbaaa523fcfa1 # v10.1.0
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    with:
      go-version-file: go.mod
      aqua_policy_allow: true
      aqua_version: v2.64.0
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
