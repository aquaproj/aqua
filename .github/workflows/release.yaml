---
name: Release
on:
  push:
    tags: [v*]
permissions: {}
jobs:
  release:
    uses: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml@0d23f1a95619a616037bae4f630f3c7e23ec1def # v11.0.0-0
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    with:
      go-version-file: go.mod
      aqua_policy_allow: true
      aqua_version: v2.64.0
      split_build: true
      slsa_provenance: true
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
