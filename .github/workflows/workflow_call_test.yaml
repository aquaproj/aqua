---
name: test (workflow_call)
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
permissions: {}
jobs:
  path-filter:
    # Get changed files to filter jobs
    timeout-minutes: 10
    outputs:
      test-docker: ${{steps.changes.outputs.test-docker}}
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            test-docker:
              - Dockerfile
              - .github/workflows/wc-test-docker.yaml

  # Download Go modules through Takumi Guard once, which requires id-token: write,
  # and share them with the jobs below via the artifact gomodule,
  # so that the jobs running the code of aqua and its dependencies don't have id-token: write.
  # go-test-workflow requires go-licenses in the artifact.
  gomodule:
    uses: suzuki-shunsuke/download-go-module-action/.github/workflows/download.yaml@e03acd0c9d3d230019ebb7bd4a62507431fe4316 # v0.0.10
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.66.1
      aqua_packages: go-licenses
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  test:
    uses: suzuki-shunsuke/go-test-workflow/.github/workflows/test.yaml@ff8934b3958ec0c1b0a6fce445052e2d2a42e8c9 # v3.2.4
    needs: gomodule
    with:
      aqua_version: v2.66.1
      golangci-lint-timeout: 120s
      go-version-file: go.mod
      gomodule_artifact_name: gomodule
    permissions:
      pull-requests: write
      contents: read
      id-token: write # The skipped gomodule job of go-test-workflow still requires this permission

  # The unit tests must not write anything into the working tree. They used to:
  # while afero was being removed, a package created a directory for real while
  # the file next to it still went into a memory-mapped filesystem, and
  # git status stayed quiet because git doesn't track empty directories.
  # git clean does list them.
  test-no-side-effect:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: gomodule
    permissions:
      contents: read
    env:
      # Use only the modules downloaded in the gomodule job.
      GOPROXY: "off"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: suzuki-shunsuke/download-go-module-action/restore@v0.0.10

      - run: go test ./... > /dev/null
      - name: Check that the tests left nothing behind
        run: |
          dirty=$(git status --porcelain; git clean --dry-run -d)
          if [ -n "$dirty" ]; then
            echo "::error::the tests modified the working tree"
            echo "$dirty"
            exit 1
          fi

  test-goreleaser:
    uses: ./.github/workflows/test-goreleaser.yaml
    needs: path-filter
    permissions: {}

  test-docker:
    uses: ./.github/workflows/wc-test-docker.yaml
    needs: [path-filter, gomodule]
    if: needs.path-filter.outputs.test-docker == 'true'
    permissions:
      contents: read

  integration-test:
    uses: ./.github/workflows/wc-integration-test.yaml
    needs: gomodule
    permissions:
      contents: read

  test_doc:
    uses: suzuki-shunsuke/release-doc-action/.github/workflows/test.yaml@1cb15eb99aa8f0ae05ae28174430e49579e878fa # v0.2.0
    with:
      # Build the document only if these files are changed
      paths: |
        website/**
        .github/workflows/test.yaml
        .github/workflows/workflow_call_test.yaml
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      pull-requests: read
      contents: read
      id-token: write

  test-workflow:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.66.1
    permissions:
      contents: read
      pull-requests: read
