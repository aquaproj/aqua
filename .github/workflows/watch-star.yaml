---
name: watch-star
on:
  watch:
    types:
      - started
jobs:
  watch-star:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - uses: suzuki-shunsuke/watch-star-action@v0.1.1
        with:
          number: 2139 # https://github.com/aquaproj/aqua/issues/2139
