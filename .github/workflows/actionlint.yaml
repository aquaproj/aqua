---
name: actionlint
on: pull_request
jobs:
  actionlint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: suzuki-shunsuke/actionlint-action@v0.2.2
